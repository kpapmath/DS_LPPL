# Tuning settings for `make pipeline-full` (config/tuning.yaml with source scan =
# full-base, the window search aligned to the 25-day grid and GA benchmark windows from 1987 onwards).
# Hyperparameter-tuning studies (see docs/tuning.md).
# Search-space syntax per parameter:
#   [low, high]                 uniform (int if both bounds are ints, else float)
#   [low, high, log]            log-uniform
#   {low, high, step}           stepped int/float
#   {choices: [...]}            categorical
#   {..., when: other_param}    only sampled when `other_param` is true (conditional)

seed: 0                        # sampler seed (TPE) and benchmark/trial seeds
mlflow_experiment_prefix: lppl # experiments: lppl-ga, lppl-indicator

# --------------------------------------------------------------------------- study 1
# Tune the genetic algorithm: reach the best achievable SSE with as few objective
# evaluations as possible, on a fixed benchmark of real + synthetic windows.
ga:
  benchmark:
    n_real: 40                 # random real windows from the DB (ticker, end date, length)
    n_synthetic: 8             # LPPLS series with known parameters + 1% noise
    lengths: [125, 250, 500, 750]
    start: 1987-01-01          # end dates drawn from [start, last available date]
    seed: 7
    oracle_restarts: 3         # oracle = best of large GA x restarts, DE, multistart NM
  seeds_per_window: 2          # GA repetitions per window in each trial
  chunks: 4                    # intermediate reports (for ASHA / Optuna pruning)
  cost_weight: 0.5             # loss = mean_excess_pct + cost_weight * mean_evals / 1000
  space:
    population_size: [10, 120]
    generations: [5, 80]
    elite: [0, 5]
    tournament_size: [2, 6]
    crossover_rate: [0.5, 1.0]
    blx_alpha: [0.0, 0.6]
    mutation_rate: [0.05, 0.6]
    mutation_sigma: [0.01, 0.4, log]
    mutation_decay: [0.85, 1.0]
    patience: [3, 20]
    polish: {choices: [true, false]}
    polish_maxiter: {low: 50, high: 400, step: 25, when: polish}

# --------------------------------------------------------------------------- study 2
# Tune the detector (qualification filters + window grid) on the fits already stored
# by a scan. Filters do not affect the GA, so no refitting is needed: every trial
# re-qualifies the stored fits and recomputes the confidence indicator.
indicator:
  source_label: full-base  # the baseline scan of `make pipeline-full`
  horizon: 63                  # trading days ahead in which a drawdown counts as an event
  k_sigma: 1.5                 # event: log-drawdown <= -k_sigma * sigma_daily * sqrt(horizon)
  vol_window: 750              # trailing window for sigma (no look-ahead)
  split_date: 2024-01-01       # train: t2 < split (minus embargo); validation: t2 >= split
  embargo_days: 63             # drop train dates whose label horizon overlaps validation
  min_windows: 5               # trials with fewer windows per date are invalid
  space:
    m_min: [0.0, 0.3]
    m_max: [0.6, 1.0]
    omega_min: [1.0, 6.0]
    omega_max: [10.0, 50.0]
    tc_after: [0.05, 0.5]
    tc_margin_days: [0.0, 15.0]
    damping_min: [0.0, 1.5]
    oscillations_min: [0.0, 5.0]
    window_min_len: {low: 125, high: 375, step: 25}
    window_max_len: {low: 400, high: 750, step: 25}
    window_stride: {choices: [1, 2]}   # use every k-th stored window length
