# BURST-BUBBLE universe (docs/validation.md §6): assets with documented bubbles and crashes,
# history from 1985. Model settings = config/pipeline_tuned.yaml (tuned GA adopted, detector
# filters at their defaults), analysis date every 10 trading days, 26 windows 125..750 step 25.
# Nothing here was tuned on these assets. Oil is left out: WTI futures closed negative in 2020.
