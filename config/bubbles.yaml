  omega_min: 2.0
  omega_max: 25.0
  tc_before: 0.05
  tc_after: 0.2
  tc_margin_days: 3.0
  damping_min: 0.5
  oscillations_min: 2.5
  max_rmse: null
ga:
  population_size: 91
  generations: 6
  elite: 1
  tournament_size: 2
  crossover_rate: 0.980666407753164
  blx_alpha: 0.5085303123462986
  mutation_rate: 0.3419337587196775
  mutation_sigma: 0.21863092229693892
  mutation_decay: 0.9333274219981481
