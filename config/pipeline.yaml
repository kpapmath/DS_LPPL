# FULL-PIPELINE configuration (`make pipeline`): config/default.yaml at the standard density
# (analysis date every 10 trading days, 26 windows 125..750 step 25). Everything else identical.
# Default experiment configuration. Every run stores a full copy of this
# (after CLI overrides) in fit_runs.config, together with the git SHA.
seed: 42

data:
  start: 1995-01-01     # early enough for the dot-com case study (windows up to 3y)
  end: null              # null = up to the latest available day
  price_field: adj_close
  snapshot_dir: data/snapshots
  instruments:
    - {ticker: "^GSPC", name: "S&P 500", group: index, asset_type: index}
    - {ticker: "^IXIC", name: "NASDAQ Composite", group: index, asset_type: index}
    - {ticker: AAPL,  name: "Apple",     group: mag7}
    - {ticker: MSFT,  name: "Microsoft", group: mag7}
    - {ticker: GOOGL, name: "Alphabet",  group: mag7}
    - {ticker: AMZN,  name: "Amazon",    group: mag7}
    - {ticker: NVDA,  name: "NVIDIA",    group: mag7}
    - {ticker: META,  name: "Meta Platforms", group: mag7}
    - {ticker: TSLA,  name: "Tesla",     group: mag7}
    - {ticker: AVGO,  name: "Broadcom",  group: extra}
    - {ticker: JPM,   name: "JPMorgan Chase", group: extra}
    - {ticker: NFLX,  name: "Netflix",   group: extra}

scan:
  start: 2019-01-01      # first analysis date (t2)
  end: null
  step: 10               # trading days between analysis dates
  n_jobs: -1             # joblib workers (-1 = all cores)
  method: ga             # ga | de | nm  (de / nm are benchmarks)

windows:                 # window lengths in trading days, t1 = t2 - L
  min_len: 125
  max_len: 750
  step: 25

bounds:                  # GA search space
  m: [0.01, 1.0]
  omega: [1.0, 50.0]
  tc_after: 0.5          # tc in (t2 + 1 day, t2 + 0.5 * dt]
  tc_min_days: 1.0

filters:                 # qualification (Sornette et al. 2015)
  m_min: 0.1
  m_max: 0.9
  omega_min: 2.0
  omega_max: 25.0
  tc_before: 0.05
  tc_after: 0.2
  tc_margin_days: 3.0   # reject tc pinned at the search bound (t2 + 1 day)
  damping_min: 0.5
  oscillations_min: 2.5
  max_rmse: null

ga:
  population_size: 40
  generations: 30
  elite: 3
  tournament_size: 3
  crossover_rate: 0.9
  blx_alpha: 0.3
  mutation_rate: 0.25
  mutation_sigma: 0.15
  mutation_decay: 0.95
  mutation_sigma_min: 0.005
  patience: 10
  tol: 1.0e-6
  polish: true
  polish_maxiter: 200
