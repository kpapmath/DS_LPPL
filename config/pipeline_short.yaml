# SHORT-SCALE scan of the 12-stock pipeline universe (config/pipeline.yaml): identical except for the windows,
# 8 windows of 40..180 trading days (the "short" scale of DS LPPLS, Sornette et al. 2015).
# Analysis dates are counted back from the last day with the same step, so they align with the
# long-scale scan. Used by the refined signal (docs/combined_model.md).
seed: 42
data:
  start: 1995-01-01
  end: null
  price_field: adj_close
  snapshot_dir: data/snapshots
  instruments:
  - ticker: ^GSPC
    name: S&P 500
    group: index
    asset_type: index
  - ticker: ^IXIC
    name: NASDAQ Composite
    group: index
    asset_type: index
  - ticker: AAPL
    name: Apple
    group: mag7
  - ticker: MSFT
    name: Microsoft
    group: mag7
  - ticker: GOOGL
    name: Alphabet
    group: mag7
  - ticker: AMZN
    name: Amazon
    group: mag7
  - ticker: NVDA
    name: NVIDIA
    group: mag7
  - ticker: META
    name: Meta Platforms
    group: mag7
  - ticker: TSLA
    name: Tesla
    group: mag7
  - ticker: AVGO
    name: Broadcom
    group: extra
  - ticker: JPM
    name: JPMorgan Chase
    group: extra
  - ticker: NFLX
    name: Netflix
    group: extra
scan:
  start: 2019-01-01
  end: null
  step: 10
  n_jobs: -1
  method: ga
windows:
  min_len: 40
  max_len: 180
  step: 20
bounds:
  m:
  - 0.01
  - 1.0
  omega:
  - 1.0
  - 50.0
  tc_after: 0.5
  tc_min_days: 1.0
filters:
  m_min: 0.1
  m_max: 0.9
  omega_min: 2.0
  omega_max: 25.0
  tc_before: 0.05
  tc_after: 0.2
  tc_margin_days: 3.0
  damping_min: 0.5
  oscillations_min: 2.5
  max_rmse: null
ga:
  population_size: 40
  generations: 30
  elite: 3
  tournament_size: 3
  crossover_rate: 0.9
  blx_alpha: 0.3
  mutation_rate: 0.25
  mutation_sigma: 0.15
  mutation_decay: 0.95
  mutation_sigma_min: 0.005
  patience: 10
  tol: 1.0e-06
  polish: true
  polish_maxiter: 200
