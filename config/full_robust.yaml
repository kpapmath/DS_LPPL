# ROBUST VARIANT of the full-period scan (docs/validation.md §8, pre-registered 2026-11-23):
# config/full_tuned.yaml (same universe, dates, windows, tuned GA, frozen default filters) plus
#   * 3 GA seeds per window; a window counts only if >= 2 seeds qualify with the same sign and
#     their tc agree within 0.25 * (tc - t2) + 5 days;
#   * persistence: the stored confidence is the minimum over the last 3 analysis dates (~30 days).
