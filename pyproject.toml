[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lppl"
version = "0.1.0"
description = "LPPLS bubble detection calibrated with a genetic algorithm, backed by PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "yfinance>=0.2.50",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "typer>=0.12",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "matplotlib>=3.8", "ipykernel>=6"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "nbmake>=1.5", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
lppl = "lppl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration and not network'"
markers = [
    "integration: needs a running PostgreSQL (set LPPL_DATABASE_URL or start docker compose)",
    "network: needs internet access to Yahoo Finance",
    "slow: slower statistical tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.coverage.run]
source = ["lppl"]
